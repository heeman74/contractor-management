[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes (unused imports/vars, redefined names)
  "W",    # pycodestyle warnings
  "I",    # isort (import ordering)
  "N",    # pep8-naming
  "UP",   # pyupgrade (modern Python syntax)
  "B",    # flake8-bugbear (common bugs)
  "A",    # flake8-builtins (shadowing builtins)
  "C4",   # flake8-comprehensions
  "PT",   # flake8-pytest-style
  "RET",  # flake8-return (unnecessary assignments before return)
  "SIM",  # flake8-simplify (simplifiable code)
  "RUF",  # ruff-specific rules (unused noqa, ambiguous chars, etc.)
]
ignore = [
  "E501",    # line length — handled by formatter
  "B008",    # function call in default arg (FastAPI Depends)
  "RUF001",  # ambiguous unicode chars — intentional in prompts/docs
  "RUF002",  # ambiguous unicode in docstrings — intentional
  "RUF005",  # iterable unpacking — concatenation is clearer in context
  "RUF006",  # unassigned asyncio.create_task — fire-and-forget is intentional
  "RUF012",  # mutable class variable without ClassVar (SQLAlchemy models)
  "RUF059",  # unused unpacked variable — used for readability
]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["N999", "UP", "E"]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
]
filterwarnings = [
    "error",
    # Third-party deprecation warnings we can't fix (awaiting library updates)
    "ignore:'crypt' is deprecated:DeprecationWarning",
    "ignore:datetime.datetime.utcnow:DeprecationWarning",
    "ignore:Remove `format_exc_info`:UserWarning",
    "ignore:fully NULL primary key:sqlalchemy.exc.SAWarning",
]

[dependency-groups]
dev = [
    "weasyprint>=68.1",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
