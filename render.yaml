# Render Blueprint — ContractorHub (free tier)
#
# Free-tier constraints this file works around:
#
# - Private services (type: pserv) are paid-only, so the API runs as a public
#   web service. The browser still only talks to the Next.js app; the API
#   being reachable is a consequence of the plan, not the design.
# - preDeployCommand is paid-only, so migrations run in the start command.
# - Free instances have ~512MB RAM, so uvicorn runs 1 worker rather than 4.
#   That also removes the migration race that preDeployCommand was avoiding.
# - Free instances spin down when idle; the first request after a sleep is
#   slow, and the API may need a moment before the web app can reach it.
#
# Upgrading later: set plans to starter, change the API back to `type: pserv`,
# move `alembic upgrade head` into preDeployCommand, and raise --workers.
#
# IMPORTANT: tenant isolation depends on migration 0041. Render gives a single
# owning role, and Postgres exempts a table's owner from its own RLS policies
# unless the table is FORCEd. See DEPLOY.md.

databases:
  - name: contractorhub-db
    databaseName: contractorhub
    user: contractorhub
    postgresMajorVersion: "16"
    plan: free

services:
  - type: web
    name: contractorhub-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    # start.sh runs migrations then execs uvicorn. It is a script rather than
    # an inline command because Render wraps dockerCommand in its own shell,
    # which re-quotes an inline `sh -c "a && b"` into a single command name.
    # It also binds $PORT, which Render assigns and is not necessarily 8000.
    dockerCommand: ./start.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: contractorhub-db
          property: connectionString
      # Generated once and then held stable — rotating this invalidates every
      # issued access and refresh token.
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      # Browser traffic is proxied through the web service, so the API does
      # not need to allow any origin directly.
      - key: CORS_ORIGINS
        value: ""
      # Redis is lazy-initialised and only backs chat WebSocket fan-out, so
      # the app boots without it. Leaving it unset means realtime chat relay
      # is the one feature that will not work on free tier.
      #
      # Public origin used to build password-reset links. Set this to the web
      # service's URL once it exists, then redeploy this service.
      - key: PUBLIC_WEB_URL
        sync: false
      # Transactional email. With SMTP_HOST unset the app runs in dev mode:
      # it logs reset emails and sends nothing at all.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: SMTP_FROM
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: web
    name: contractorhub-web
    runtime: docker
    dockerfilePath: ./web/Dockerfile
    dockerContext: ./web
    plan: free
    healthCheckPath: /login
    envVars:
      # Set to the API service's public URL (https://contractorhub-api.onrender.com).
      # Free tier has no private networking, so this cannot be an internal address.
      - key: FASTAPI_URL
        sync: false
      - key: NODE_ENV
        value: production
