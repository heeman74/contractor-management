name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend Lint + Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: apppassword
          POSTGRES_DB: contractorhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://appuser:apppassword@localhost:5432/contractorhub_test
      TEST_DATABASE_URL: postgresql+asyncpg://appuser:apppassword@localhost:5432/contractorhub_test
      JWT_SECRET_KEY: ci-test-secret-key-not-for-production
      ANTHROPIC_API_KEY: sk-ant-dummy-key-for-ci
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Ruff lint check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Run Alembic migrations
        run: alembic upgrade head
      - name: Run tests
        run: pytest -q --tb=short

  mobile:
    name: Flutter Lint + Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.0"
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Flutter analyze
        run: flutter analyze
      - name: Flutter test
        run: flutter test

  web:
    name: Web Lint + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint check
        run: npm run lint
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
